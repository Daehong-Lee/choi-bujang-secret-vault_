<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 자료 보호</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 2단계 자료 보호</div>
    <h1>보호된 자료실</h1>
    <p>자료 원본은 저장소에 유지되지만 정적 공개 파일에서는 제거되었습니다. 아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
    <div class="notice">자료는 더 이상 <code>/data.json</code>으로 정적으로 공개되지 않습니다. 다음 단계에서 허가된 요청만 자료를 받을 수 있도록 연결합니다.</div>
    <div class="notice" aria-label="자료 보호 상태">자료 보호 적용됨</div>
    <ul id="notes" aria-live="polite">
      <li><strong>자료 불러오는 중</strong><span>서버 함수를 통해 보호된 자료를 확인합니다.</span></li>
    </ul>
    <script>
      const notes = document.getElementById('notes');
      fetch('/api/notes', { credentials: 'same-origin' })
        .then((response) => {
          if (!response.ok) throw new Error('request failed');
          return response.json();
        })
        .then(({ notes: items }) => {
          notes.replaceChildren();
          for (const item of items) {
            const li = document.createElement('li');
            const title = document.createElement('strong');
            const content = document.createElement('span');
            title.textContent = item.title;
            content.textContent = item.content;
            li.append(title, content);
            notes.append(li);
          }
        })
        .catch(() => {
          notes.replaceChildren();
          const li = document.createElement('li');
          li.textContent = '자료를 불러오지 못했습니다.';
          notes.append(li);
        });
    </script>
  </main>
</body>
</html>
